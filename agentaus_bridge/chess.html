<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess vs Agentaus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root {
    --sq-light: #EEEED2;
    --sq-dark:  #769656;
    --highlight-sel:   rgba(20,  85,  30,  0.55);
    --highlight-move:  rgba(20,  85,  30,  0.30);
    --last-from:       rgba(155, 199, 0,   0.45);
    --last-to:         rgba(155, 199, 0,   0.45);
    --check:           rgba(220, 50,  50,  0.65);
    --coord-light:     #769656;
    --coord-dark:      #EEEED2;
    --border:          #6b3f1b;
    --border-inner:    #8b5a2b;
    --bg:              #1a1a1a;
    --panel-bg:        #242424;
    --panel-border:    #333;
    --text:            #e8e8e8;
    --text-muted:      #888;
    --accent:          #769656;
    --btn:             #769656;
    --btn-hover:       #5a7a3f;
    --btn-danger:      #c0392b;
    --thinking-gold:   #f0c040;
    --sq-size: min(10vw, 70px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px 16px;
    gap: 24px;
    flex-wrap: wrap;
  }

  /* ── Board area ───────────────────────────────────────────────── */
  #board-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Wood border */
  #board-frame {
    padding: 20px;
    background: linear-gradient(135deg,
      #8b5a2b 0%, #a0742d 15%, #c8923a 30%,
      #a0742d 50%, #8b5a2b 65%, #c8923a 80%, #a0742d 100%);
    border-radius: 6px;
    box-shadow:
      0 0 0 2px #5a3010,
      0 8px 32px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.15);
    position: relative;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq-size));
    grid-template-rows: repeat(8, var(--sq-size));
    border: 2px solid #5a3010;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
  }

  .sq {
    width:  var(--sq-size);
    height: var(--sq-size);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: filter 0.08s;
  }

  .sq.light { background: var(--sq-light); }
  .sq.dark  { background: var(--sq-dark);  }

  /* Coordinate labels in the corners of edge squares */
  .sq .coord {
    position: absolute;
    font-size: calc(var(--sq-size) * 0.18);
    font-weight: 700;
    line-height: 1;
    pointer-events: none;
    color: var(--coord-light);
  }
  .sq.dark .coord  { color: var(--coord-dark); }
  .sq .coord.rank  { bottom: 2px; left: 3px; }
  .sq .coord.file  { top: 2px; right: 3px; }

  /* Overlays */
  .sq.selected  { background: var(--highlight-sel)  !important; }
  .sq.last-from { background: var(--last-from) !important; }
  .sq.last-to   { background: var(--last-to)   !important; }
  .sq.in-check  { background: var(--check)     !important; }

  /* Piece image */
  .sq img {
    width:  88%;
    height: 88%;
    object-fit: contain;
    pointer-events: none;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
    z-index: 2;
    position: relative;
  }

  /* Legal-move indicators */
  .sq .dot {
    position: absolute;
    border-radius: 50%;
    background: rgba(0,0,0,0.20);
    width: 30%;
    height: 30%;
    pointer-events: none;
    z-index: 3;
  }
  .sq .ring {
    position: absolute;
    border-radius: 50%;
    border: calc(var(--sq-size) * 0.085) solid rgba(0,0,0,0.20);
    width: 92%;
    height: 92%;
    pointer-events: none;
    z-index: 3;
  }

  /* ── Side panel ───────────────────────────────────────────────── */
  #panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 20px 18px;
    width: 230px;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  #panel h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
    text-transform: uppercase;
  }

  #status {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.82rem;
    line-height: 1.5;
    min-height: 50px;
    white-space: pre-wrap;
  }
  #status.thinking { color: var(--thinking-gold); border-color: var(--thinking-gold); }
  #status.error    { color: #e74c3c; border-color: #e74c3c; }
  #status.win      { color: #2ecc71; border-color: #2ecc71; font-weight: 600; }

  #thinking-bar {
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--thinking-gold), var(--accent));
    background-size: 200%;
    display: none;
    animation: shimmer 1.4s infinite linear;
  }
  #thinking-bar.on { display: block; }
  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }

  #moves {
    flex: 1;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 0.78rem;
    line-height: 1.9;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  .mn  { color: #555; min-width: 22px; display: inline-block; }
  .mw  { color: #ddd; margin-right: 8px; }
  .mb  { color: #aaa; margin-right: 14px; }

  #analysis {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 0.75rem;
    color: #888;
    min-height: 36px;
    line-height: 1.4;
    font-style: italic;
  }

  .btn-row { display: flex; gap: 8px; }

  button {
    background: var(--btn);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 9px 10px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    transition: background 0.15s, transform 0.08s;
    flex: 1;
  }
  button:hover  { background: var(--btn-hover); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.danger { background: #444; }
  button.danger:hover { background: var(--btn-danger); }

  #diff-row { display: flex; gap: 6px; }
  #diff-row button {
    background: #2a2a2a;
    font-size: 0.75rem;
    padding: 6px 4px;
    border: 1px solid #333;
  }
  #diff-row button.on { background: var(--btn); border-color: var(--btn); }

  #captured { font-size: 0.85rem; min-height: 20px; letter-spacing: 1px; }
</style>
</head>
<body>

<div id="board-wrap">
  <div id="board-frame">
    <div id="board"></div>
  </div>
</div>

<div id="panel">
  <h1>♟ Chess vs Agentaus</h1>

  <div id="diff-row">
    <button onclick="setDiff('fast')"     id="d-fast"     class="on">Fast</button>
    <button onclick="setDiff('balanced')" id="d-balanced"         >Balanced</button>
    <button onclick="setDiff('strong')"   id="d-strong"           >Strong</button>
  </div>

  <div id="thinking-bar"></div>
  <div id="status">Your turn — you are White.</div>
  <div id="analysis">Waiting for Agentaus…</div>

  <div id="captured"></div>
  <div id="moves"></div>

  <div class="btn-row">
    <button onclick="newGame()">New Game</button>
    <button class="danger" onclick="undoMove()">Undo</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────
const BRIDGE = 'http://127.0.0.1:8787';

// All three route to Agentaus — only thinking/review changes.
const DIFF_MODELS = {
  fast:     'claude-agentaus-fast',
  balanced: 'claude-agentaus-balanced',
  strong:   'agentaus',
};

// Wikimedia Cburnett piece set (same as Wikipedia / Lichess)
const PIECE_IMGS = {
  wK: 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
  wQ: 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
  wR: 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
  wB: 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
  wN: 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
  wP: 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
  bK: 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg',
  bQ: 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
  bR: 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
  bB: 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
  bN: 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
  bP: 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
};

const PIECE_VALUES = { p:1, n:3, b:3, r:5, q:9 };

// ── State ─────────────────────────────────────────────────────────
let game, selectedSq, lastFrom, lastTo, diff = 'fast', busy = false;

// ── Init ──────────────────────────────────────────────────────────
function newGame() {
  game = new Chess();
  selectedSq = lastFrom = lastTo = null;
  busy = false;
  setStatus('Your turn — you are White.');
  setAnalysis('Waiting for Agentaus…');
  document.getElementById('moves').innerHTML = '';
  document.getElementById('captured').textContent = '';
  renderBoard();
}

function setDiff(d) {
  diff = d;
  ['fast','balanced','strong'].forEach(k =>
    document.getElementById('d-'+k).className = k === d ? 'on' : '');
}

function setStatus(msg, cls='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls;
}

function setAnalysis(msg) {
  document.getElementById('analysis').textContent = msg;
}

function thinking(on) {
  busy = on;
  document.getElementById('thinking-bar').className = on ? 'on' : '';
}

// ── Board rendering ───────────────────────────────────────────────
function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  const legalTargets = selectedSq
    ? new Set(game.moves({ square: selectedSq, verbose: true }).map(m => m.to))
    : new Set();

  for (let r = 7; r >= 0; r--) {
    for (let c = 0; c < 8; c++) {
      const sq = files[c] + (r + 1);
      const isLight = (r + c) % 2 === 1;
      const div = document.createElement('div');
      div.className = 'sq ' + (isLight ? 'light' : 'dark');
      div.dataset.sq = sq;

      // Coordinate labels — rank on left-edge squares, file on bottom-edge squares
      if (c === 0) {
        const s = document.createElement('span');
        s.className = 'coord rank';
        s.textContent = r + 1;
        div.appendChild(s);
      }
      if (r === 0) {
        const s = document.createElement('span');
        s.className = 'coord file';
        s.textContent = files[c];
        div.appendChild(s);
      }

      // Highlights
      if (sq === selectedSq) div.classList.add('selected');
      else if (sq === lastFrom) div.classList.add('last-from');
      else if (sq === lastTo)   div.classList.add('last-to');

      if (game.in_check()) {
        const king = findKing(game.turn());
        if (sq === king) div.classList.add('in-check');
      }

      // Piece
      const piece = game.get(sq);
      if (piece) {
        const img = document.createElement('img');
        img.src = PIECE_IMGS[piece.color + piece.type.toUpperCase()];
        img.alt = piece.color + piece.type;
        div.appendChild(img);
      }

      // Legal move indicators
      if (legalTargets.has(sq)) {
        const marker = document.createElement('div');
        marker.className = piece ? 'ring' : 'dot';
        div.appendChild(marker);
      }

      div.addEventListener('click', () => onSquareClick(sq));
      board.appendChild(div);
    }
  }
}

const files = ['a','b','c','d','e','f','g','h'];

function findKing(color) {
  for (let r = 1; r <= 8; r++)
    for (let c = 0; c < 8; c++) {
      const sq = files[c] + r;
      const p = game.get(sq);
      if (p && p.type === 'k' && p.color === color) return sq;
    }
}

// ── Interaction ───────────────────────────────────────────────────
function onSquareClick(sq) {
  if (busy || game.game_over() || game.turn() !== 'w') return;
  const piece = game.get(sq);

  if (selectedSq) {
    const legal = game.moves({ square: selectedSq, verbose: true });
    const target = legal.find(m => m.to === sq);
    if (target) {
      const result = game.move({ from: selectedSq, to: sq, promotion: 'q' });
      if (result) {
        lastFrom = selectedSq; lastTo = sq; selectedSq = null;
        renderBoard();
        addMoveToHistory(result);
        updateCaptured();
        checkGameOver() || agentausMove(result.san);
        return;
      }
    }
    selectedSq = (piece && piece.color === 'w') ? sq : null;
    renderBoard();
    return;
  }

  if (piece && piece.color === 'w') {
    selectedSq = sq;
    renderBoard();
  }
}

function undoMove() {
  if (busy) return;
  game.undo(); // undo Agentaus move
  game.undo(); // undo player move
  selectedSq = lastFrom = lastTo = null;
  renderBoard();
  updateCaptured();
  setStatus('Your turn — you are White.');
  setAnalysis('Move undone.');
}

// ── Move history panel ────────────────────────────────────────────
function addMoveToHistory(move) {
  const movesEl = document.getElementById('moves');
  const plyCount = game.history().length;
  const moveNum  = Math.ceil(plyCount / 2);

  if (move.color === 'w') {
    const row = document.createElement('div');
    row.id = 'row-' + moveNum;
    row.innerHTML = `<span class="mn">${moveNum}.</span><span class="mw">${move.san}</span>`;
    movesEl.appendChild(row);
  } else {
    const row = document.getElementById('row-' + moveNum);
    if (row) row.innerHTML += `<span class="mb">${move.san}</span>`;
  }
  movesEl.scrollTop = movesEl.scrollHeight;
}

// ── Captured pieces display ───────────────────────────────────────
const PIECE_ICONS = { p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚' };

function updateCaptured() {
  const hist = game.history({ verbose: true });
  const caps = hist.filter(m => m.captured).map(m => ({
    color: m.color === 'w' ? 'b' : 'w',
    type: m.captured,
  }));
  document.getElementById('captured').textContent =
    caps.map(c => PIECE_ICONS[c.type]).join('') || '';
}

// ── Game over check ───────────────────────────────────────────────
function checkGameOver() {
  if (game.in_checkmate()) {
    const w = game.turn() === 'w' ? 'Agentaus wins! 🤖' : 'You win! 🎉';
    setStatus('Checkmate — ' + w, 'win');
    return true;
  }
  if (game.in_stalemate()) { setStatus('Stalemate — draw.', 'win'); return true; }
  if (game.in_draw())      { setStatus('Draw.', 'win'); return true; }
  return false;
}

// ── Agentaus move ─────────────────────────────────────────────────
async function agentausMove(humanSan) {
  thinking(true);
  setStatus('Agentaus is analysing…', 'thinking');

  const fen     = game.fen();
  const history = game.history().join(' ');
  const legalMoves = game.moves().join(', ');

  const userContent =
    `You are playing chess as Black against a human opponent.\n\n` +
    `Position (FEN): ${fen}\n` +
    `Move history:   ${history || '(game start)'}\n` +
    `Human just played: ${humanSan}\n` +
    `Legal moves available: ${legalMoves}\n\n` +
    `Analyse the position in this order:\n` +
    `1. Does the human's last move create a direct threat (check, mate threat, fork, pin, skewer, en passant)?\n` +
    `2. Do you have any immediate winning tactics (checkmate, fork, pin, discovered attack)?\n` +
    `3. If no tactics, choose the strongest strategic move (development, centre control, king safety).\n\n` +
    `Reply with ONLY your chosen move in standard algebraic notation exactly as it appears in the legal moves list above. ` +
    `No explanation, no commentary — just the move.`;

  let moveStr = null;
  let analysisNote = '';

  try {
    const res = await fetch(`${BRIDGE}/v1/messages`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': 'chess-client',
        'anthropic-version': '2023-06-01',
      },
      body: JSON.stringify({
        model: DIFF_MODELS[diff],
        max_tokens: 30,
        system:
          'You are a chess engine. You receive a position and legal moves list. ' +
          'You reply with exactly one legal move in SAN notation. No other text.',
        messages: [{ role: 'user', content: userContent }],
      }),
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`Bridge HTTP ${res.status}: ${err.slice(0, 120)}`);
    }

    const data  = await res.json();
    const raw   = (data.content?.[0]?.text || '').trim();
    moveStr     = raw.split(/\s+/)[0].replace(/[^a-zA-Z0-9\-=+#]/g, '');
    analysisNote = `Agentaus played: ${moveStr}`;
  } catch (e) {
    thinking(false);
    setStatus('Bridge error — is the bridge running?\n\n' + e.message, 'error');
    setAnalysis('Could not reach bridge.');
    return;
  }

  thinking(false);

  // Apply move (try strict, then sloppy)
  let result = game.move(moveStr) || game.move(moveStr, { sloppy: true });

  if (!result) {
    // Fallback: pick best legal move by material value or first available
    const legal = game.moves({ verbose: true });
    const captures = legal.filter(m => m.captured)
      .sort((a, b) => PIECE_VALUES[b.captured] - PIECE_VALUES[a.captured]);
    result = game.move(captures[0] || legal[0]);
    analysisNote = `(parsed fallback) ${result.san}`;
  }

  if (result) {
    lastFrom = result.from; lastTo = result.to;
    renderBoard();
    addMoveToHistory(result);
    updateCaptured();
    setAnalysis(analysisNote);
    checkGameOver() || setStatus('Your turn — you are White.');
  }
}

// ── Start ─────────────────────────────────────────────────────────
newGame();
</script>
</body>
</html>
