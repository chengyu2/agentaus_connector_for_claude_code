name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      # The system document readers (LibreOffice, poppler, tesseract) are optional: the tests
      # that run them for real skip unless every one is installed. Ubuntu always installs them,
      # restored from a cache after the first run. macOS installs them only on pushes to main,
      # because the LibreOffice cask alone takes minutes.
      - name: Install document readers (Ubuntu, cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libreoffice-writer libreoffice-calc libreoffice-impress poppler-utils tesseract-ocr
          version: "1"  # bump to rebuild the cache

      - name: Install document readers (macOS, pushes to main only)
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install poppler tesseract
          brew install --cask libreoffice

      - name: Check the readers are on hand
        if: runner.os == 'Linux' || github.event_name == 'push'
        run: |
          pdftotext -v
          pdftoppm -v
          tesseract --version
          if [ "$RUNNER_OS" = macOS ]; then
            /Applications/LibreOffice.app/Contents/MacOS/soffice --version
          else
            soffice --version
          fi

      # uv installs Python and the packages from its cache in seconds.
      - uses: astral-sh/setup-uv@v10.4.0  # setup-uv publishes no floating major tag
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install Python dependencies
        run: uv pip install -r requirements.txt pytest pytest-xdist

      # One worker per core. loadfile keeps each test file on one worker, because some
      # classes share setUpClass state. Same files as `unittest discover -s tests`.
      - name: Run tests
        timeout-minutes: 10
        run: python -m pytest tests -n auto --dist loadfile -o python_files='test_*.py' -p no:cacheprovider -q -ra --durations=10

  # Windows has no bash, so the scripts/install.sh path never runs there. This job proves the
  # three .ps1 scripts parse and that install.ps1 completes an unattended install: virtualenv,
  # the chosen components, the scheduled task and command, and their removal.
  # A live `-m agentaus_bridge --check` needs the AGENTAUS_API_KEY secret, so it is not part
  # of CI; the requirements check inside install.ps1 covers the same failure modes that used
  # to slip through (a missing package reported as success).
  windows:
    name: Windows / PowerShell install
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Parse the three PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("scripts/install.ps1", "scripts/start-bridge.ps1", "scripts/claude-agentaus.ps1")) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $f), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Parse errors in $f" }
            Write-Host "parsed OK: $f"
          }

      # The guided setup, unattended. The unquoted pdf,outline is deliberate: PowerShell makes
      # it an array, and install.ps1 must hand setup one "pdf,outline" string. The service and
      # command are real: a Task Scheduler task and agentaus-bridge.cmd, removed again below.
      - name: Run install.ps1 (bootstrap, guided setup with --yes)
        shell: pwsh
        run: |
          $env:INSTALL_DOCUMENT_READERS = "0"
          & .\scripts\install.ps1 --yes --preset minimal --with pdf,outline,service,command --settings none --no-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ScheduledTask -TaskName AgentausBridge | Format-List TaskName, State
          & "$HOME\.local\bin\agentaus-bridge.cmd" status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$HOME\.local\bin\agentaus-bridge.cmd" uninstall --yes
          if (Get-ScheduledTask -TaskName AgentausBridge -ErrorAction SilentlyContinue) { throw "task still registered" }

      # `powershell -ExecutionPolicy Bypass -File ...` runs Windows PowerShell 5.1, not pwsh 7,
      # and the two treat native stderr differently, so run the installer under 5.1 too.
      - name: Run install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $env:INSTALL_DOCUMENT_READERS = "0"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\install.ps1 --yes --preset minimal --with pdf,outline --settings none --no-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the bridge imports on Windows
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -c "from agentaus_bridge import requirements, documents, pdf; print('bridge import OK')"

  # scripts/install.sh, unattended, on each Unix the installer supports. As root in the
  # Fedora and Arch containers and with passwordless sudo on the runners, so the poppler
  # component really goes through apt, dnf, pacman and brew.
  install-unix:
    name: install.sh / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu, os: ubuntu-latest, container: "" }
          - { name: macos, os: macos-latest, container: "" }
          - { name: fedora, os: ubuntu-latest, container: "fedora:latest", prep: "dnf install -y git python3" }
          - { name: arch, os: ubuntu-latest, container: "archlinux:latest", prep: "pacman -Syu --noconfirm --needed git python" }
    steps:
      - name: Prepare the container
        if: matrix.prep
        run: ${{ matrix.prep }}
      - uses: actions/checkout@v7
      - name: Run install.sh with --yes
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          ./scripts/install.sh --yes --preset minimal --with pdf,poppler,outline,command --settings none --no-check
          ~/.local/bin/agentaus-bridge status
          command -v pdftotext
          ~/.local/bin/agentaus-bridge uninstall --yes
