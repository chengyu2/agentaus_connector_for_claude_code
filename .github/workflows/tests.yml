name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The bridge requires LibreOffice, poppler and tesseract
      # (agentaus_bridge/requirements.py), and tests/test_requirements.py runs them.
      - name: Install document readers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer libreoffice-calc libreoffice-impress \
            poppler-utils tesseract-ocr

      - name: Install document readers (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install poppler tesseract
          brew install --cask libreoffice

      - name: Check the readers are on hand
        run: |
          pdftotext -v
          pdftoppm -v
          tesseract --version
          if [ "$RUNNER_OS" = macOS ]; then
            /Applications/LibreOffice.app/Contents/MacOS/soffice --version
          else
            soffice --version
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        timeout-minutes: 20
        run: python -m unittest discover -s tests
